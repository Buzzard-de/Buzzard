name: Deploy Buzzard API

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "data/**"
      - "package.json"
      - "render.yaml"
      - "scripts/render-bootstrap.mjs"
      - "scripts/wait-for-api-health.mjs"
  workflow_dispatch:
    inputs:
      skip_health_check:
        description: Skip /api/health verification (emergency only)
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Probe API
        id: probe
        run: |
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "https://buzzard-api.onrender.com/api/health" || echo "000")
          routing=$(curl -sSI "https://buzzard-api.onrender.com/api/health" | awk -F': ' 'tolower($1)=="x-render-routing"{print $2}' | tr -d '\r')
          echo "http_code=$code" >> "$GITHUB_OUTPUT"
          echo "routing=$routing" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ]; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID || '' }}
        run: |
          set -euo pipefail
          DEPLOYED=0

          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deploy hook triggered."
            DEPLOYED=1
          elif [ -n "$RENDER_API_KEY" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set; redeploying via Render API."
            node scripts/render-bootstrap.mjs
            DEPLOYED=1
          else
            echo "No Render deploy hook or API key configured."
            echo "If render.yaml Blueprint is connected, Render auto-deploys from git pushes."
            echo "One-time setup:"
            echo "https://dashboard.render.com/blueprint/new?repo=https://github.com/Buzzard-de/Buzzard"
          fi

          echo "deploy_triggered=$DEPLOYED" >> "$GITHUB_ENV"

      - name: Verify API health (full wait after deploy)
        if: ${{ (env.deploy_triggered == '1' || steps.probe.outputs.live == 'true') && (github.event_name != 'workflow_dispatch' || inputs.skip_health_check != 'true') }}
        env:
          HEALTH_TIMEOUT_MS: "900000"
          FAST_FAIL_NO_SERVER: "0"
        run: node scripts/wait-for-api-health.mjs

      - name: Warn when API not provisioned
        if: ${{ env.deploy_triggered != '1' && steps.probe.outputs.live != 'true' && (github.event_name != 'workflow_dispatch' || inputs.skip_health_check != 'true') }}
        env:
          HEALTH_TIMEOUT_MS: "30000"
          FAST_FAIL_NO_SERVER: "1"
          ALLOW_UNPROVISIONED: "1"
        run: node scripts/wait-for-api-health.mjs
