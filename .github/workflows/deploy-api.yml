name: Deploy Buzzard API

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "data/**"
      - "package.json"
      - "render.yaml"
  workflow_dispatch:

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deploy hook triggered."
          else
            echo "RENDER_DEPLOY_HOOK_URL is not set."
            echo "Connect render.yaml in the Render dashboard or add the deploy hook secret."
            echo "Default API URL for frontend: https://buzzard-api.onrender.com"
          fi
