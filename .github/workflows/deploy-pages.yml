name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build
        env:
          NEXT_PUBLIC_SITE_URL: https://buzzard24.de
          NEXT_PUBLIC_CONTACT_EMAIL: info@buzzard24.de
          NEXT_PUBLIC_CONTACT_PHONE: "+4915126219394"
          NEXT_PUBLIC_CONTACT_PHONE_DISPLAY: "+49 151 26219394"
          NEXT_PUBLIC_SALES_ENABLED: "0"
          NEXT_PUBLIC_SQLITE_STORE: "1"
          NEXT_PUBLIC_BUZZARD_API_URL: ${{ vars.BUZZARD_API_URL || secrets.BUZZARD_API_URL || 'https://buzzard-api.onrender.com' }}
          NEXT_PUBLIC_CATALOG_SEO: "1"
          NEXT_PUBLIC_VEHICLE_API: "1"
          NEXT_PUBLIC_LOCALIZATION_FEEDS: "1"
          NEXT_PUBLIC_CUSTOMER_CHECKOUT: "1"
          NEXT_PUBLIC_CUSTOMER_SUPPORT: "1"
          NEXT_PUBLIC_CRM_LOYALTY: "1"
          NEXT_PUBLIC_ANALYTICS_DASHBOARD: "1"
          NEXT_PUBLIC_MARKETING_CENTER: "1"
          NEXT_PUBLIC_MARKETPLACE_HUB: "1"
          NEXT_PUBLIC_LOGISTICS_FULFILLMENT: "1"
          NEXT_PUBLIC_WMS_INVENTORY: "1"
          NEXT_PUBLIC_PIM_CATALOG: "1"
          NEXT_PUBLIC_IDENTITY_SECURITY: "1"
          NEXT_PUBLIC_PAYMENTS_FINANCE: "1"
          NEXT_PUBLIC_ORDER_MANAGEMENT: "1"
          NEXT_PUBLIC_CART_CHECKOUT: "1"
          NEXT_PUBLIC_CRM_CUSTOMER_SERVICE: "1"
          NEXT_PUBLIC_RETURNS_RMA: "1"
          NEXT_PUBLIC_MARKETING_LOYALTY: "1"
          NEXT_PUBLIC_REVIEWS_RATINGS: "1"
          NEXT_PUBLIC_AI_CENTER: "1"
          NEXT_PUBLIC_ADVANCED_SEARCH: "1"
          NEXT_PUBLIC_PRODUCT_CATALOG_PIM: "1"
          NEXT_PUBLIC_SUPPLIER_INTEGRATION_HUB: "1"
          NEXT_PUBLIC_ORDER_MANAGEMENT_V32: "1"
          NEXT_PUBLIC_FULFILLMENT_V33: "1"
          NEXT_PUBLIC_LOGISTICS_V34: "1"
          NEXT_PUBLIC_MARKETPLACE_V35: "1"
          NEXT_PUBLIC_PAYMENTS_V36: "1"
          NEXT_PUBLIC_INTERNATIONAL_V37: "1"
          NEXT_PUBLIC_SECURITY_V38: "1"
          NEXT_PUBLIC_ANALYTICS_V39: "1"
          NEXT_PUBLIC_MASTER_ADMIN_V40: "1"
          NEXT_PUBLIC_AI_CHAT_ENABLED: "1"
          NEXT_PUBLIC_GA4_ID: ${{ vars.NEXT_PUBLIC_GA4_ID || secrets.NEXT_PUBLIC_GA4_ID || '' }}
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID || secrets.NEXT_PUBLIC_GTM_ID || '' }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID || secrets.NEXT_PUBLIC_META_PIXEL_ID || '' }}
          NEXT_PUBLIC_TIKTOK_PIXEL_ID: ${{ vars.NEXT_PUBLIC_TIKTOK_PIXEL_ID || secrets.NEXT_PUBLIC_TIKTOK_PIXEL_ID || '' }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION || secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION || '' }}
        run: npm ci && npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
