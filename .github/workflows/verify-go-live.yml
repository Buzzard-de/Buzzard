name: Verify Go-Live

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Pages routes and API health
        run: node scripts/verify-go-live.mjs
        env:
          BUZZARD_SITE_URL: https://buzzard24.de
          BUZZARD_API_URL: https://buzzard-api.onrender.com
