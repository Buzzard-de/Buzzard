services:
  buzzard-api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  buzzard-scheduler:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    env_file:
      - .env
    command: ["python", "scripts/run_scheduler.py"]
    restart: unless-stopped
    depends_on:
      - buzzard-api
