<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buzzard Intelligence — Voice</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif}
main{max-width:760px;margin:40px auto;padding:24px}
.card{background:#1b1b1b;border:1px solid #444;border-radius:18px;padding:24px}
.avatar{width:120px;height:120px;border-radius:50%;margin:0 auto 20px;
background:linear-gradient(135deg,#111,#b8860b);display:flex;align-items:center;
justify-content:center;font-size:52px}
h1{text-align:center;margin-bottom:6px}
.status{text-align:center;color:#bbb;margin-bottom:22px}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button,select{font-size:16px;padding:12px 16px;border-radius:10px;border:1px solid #555;background:#222;color:#eee}
button{cursor:pointer}
button:hover{background:#333}
#log{margin-top:24px;max-height:360px;overflow:auto;border-top:1px solid #333;padding-top:14px;white-space:pre-wrap}
.msg{padding:10px 0;border-bottom:1px solid #292929}
.me{font-weight:bold}.ai{font-weight:bold}
.hint{color:#888;font-size:14px;text-align:center;margin-top:12px}
</style>
</head>
<body>
<main>
<div class="card">
<div class="avatar">🦅</div>
<h1>Buzzard Intelligence Voice</h1>
<div class="status" id="status">Bereit</div>

<div class="controls">
<select id="lang">
<option value="de-DE" selected>Deutsch</option>
<option value="tr-TR">Türkçe</option>
</select>
<button id="listen">🎙️ Sprechen</button>
<button id="stop">⏹ Stopp</button>
<button id="speak">🔊 Antwort vorlesen</button>
</div>

<p class="hint">Sprich z. B. „Bericht“, „Warnungen“ oder „Posteingang“.</p>
<div id="log"></div>
</div>
</main>

<script>
const statusEl=document.getElementById("status");
const log=document.getElementById("log");
const langEl=document.getElementById("lang");
let lastReply="";

function add(role,text){
  const d=document.createElement("div");
  d.className="msg";
  d.innerHTML=`<span class="${role==='Du'?'me':'ai'}">${role}:</span> ${escapeHtml(text)}`;
  log.appendChild(d);
  log.scrollTop=log.scrollHeight;
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function speak(text){
  if(!("speechSynthesis" in window)){statusEl.textContent="Sprachausgabe nicht unterstützt.";return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=langEl.value;
  u.rate=.95;
  speechSynthesis.speak(u);
}
async function send(text){
  add("Du",text);
  statusEl.textContent="Antwort wird erstellt...";
  const r=await fetch("/api/message",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({text,language:langEl.value})});
  const data=await r.json();
  lastReply=data.reply||data.error||"Keine Antwort erhalten.";
  add("Buzzard",lastReply);
  statusEl.textContent="Bereit";
}
let recognition=null;
if("webkitSpeechRecognition" in window || "SpeechRecognition" in window){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new R();
  recognition.continuous=false;
  recognition.interimResults=false;
  recognition.onstart=()=>statusEl.textContent="Ich höre zu...";
  recognition.onerror=e=>statusEl.textContent="Spracherkennung Fehler: "+e.error;
  recognition.onend=()=>{if(statusEl.textContent==="Ich höre zu...")statusEl.textContent="Bereit"};
  recognition.onresult=e=>{
    const text=e.results[0][0].transcript;
    send(text);
  };
}else{
  statusEl.textContent="Spracherkennung in diesem Browser nicht verfügbar.";
}
document.getElementById("listen").onclick=()=>{
  if(recognition){recognition.lang=langEl.value;recognition.start();}
};
document.getElementById("stop").onclick=()=>{
  if(recognition)recognition.stop();
  speechSynthesis.cancel();
  statusEl.textContent="Bereit";
};
document.getElementById("speak").onclick=()=>{if(lastReply)speak(lastReply)};
</script>
</body>
</html>
