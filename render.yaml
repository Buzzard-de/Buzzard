services:
  - type: web
    name: buzzard-api
    runtime: node
    plan: free
    region: frankfurt
    repo: https://github.com/Buzzard-de/Buzzard
    branch: main
    autoDeployTrigger: commit
    rootDir: .
    buildCommand: cd server && npm ci
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BUZZARD_AI_CHAT_ENABLED
        value: "1"
      - key: BUZZARD_DB_ENABLED
        value: "1"
      - key: BUZZARD_COMMERCIAL_INTEGRATIONS
        value: "1"
      - key: BUZZARD_ORDER_AUTOMATION
        value: "1"
      - key: BUZZARD_SUPPLIER_HUB
        value: "1"
      - key: BUZZARD_CATALOG_SEO
        value: "1"
      - key: BUZZARD_LOCALIZATION_FEEDS
        value: "1"
      - key: BUZZARD_CUSTOMER_CHECKOUT
        value: "1"
      - key: BUZZARD_CUSTOMER_SUPPORT
        value: "1"
      - key: BUZZARD_CRM_LOYALTY
        value: "1"
      - key: BUZZARD_ANALYTICS_DASHBOARD
        value: "1"
      - key: BUZZARD_MARKETING_CENTER
        value: "1"
      - key: BUZZARD_MARKETPLACE_HUB
        value: "1"
      - key: BUZZARD_LOGISTICS_FULFILLMENT
        value: "1"
      - key: BUZZARD_WMS_INVENTORY
        value: "1"
      - key: BUZZARD_PIM_CATALOG
        value: "1"
      - key: BUZZARD_IDENTITY_SECURITY
        value: "1"
      - key: BUZZARD_PAYMENTS_FINANCE
        value: "1"
      - key: BUZZARD_ORDER_MANAGEMENT
        value: "1"
      - key: BUZZARD_CART_CHECKOUT
        value: "1"
      - key: BUZZARD_CRM_CUSTOMER_SERVICE
        value: "1"
      - key: BUZZARD_RETURNS_RMA
        value: "1"
      - key: BUZZARD_MARKETING_LOYALTY
        value: "1"
      - key: BUZZARD_REVIEWS_RATINGS
        value: "1"
      - key: BUZZARD_AI_CENTER
        value: "1"
      - key: BUZZARD_ADVANCED_SEARCH
        value: "1"
      - key: BUZZARD_PRODUCT_CATALOG_PIM
        value: "1"
      - key: BUZZARD_SUPPLIER_INTEGRATION_HUB
        value: "1"
      - key: BUZZARD_ORDER_MANAGEMENT_V32
        value: "1"
      - key: BUZZARD_FULFILLMENT_V33
        value: "1"
      - key: BUZZARD_LOGISTICS_V34
        value: "1"
      - key: BUZZARD_MARKETPLACE_V35
        value: "1"
      - key: BUZZARD_PAYMENTS_V36
        value: "1"
      - key: BUZZARD_INTERNATIONAL_V37
        value: "1"
      - key: BUZZARD_SECURITY_V38
        value: "1"
      - key: BUZZARD_ANALYTICS_V39
        value: "1"
      - key: BUZZARD_MASTER_ADMIN_V40
        value: "1"
      - key: PUBLIC_BASE_URL
        value: https://buzzard24.de
      - key: DEFAULT_SUPPLIER_MODE
        value: manual
      - key: BUZZARD_ABANDONED_CART_DELAY_HOURS
        value: "24"
      - key: BUZZARD_SALES_ENABLED
        value: "0"
      - key: DEFAULT_PAYMENT_PROVIDER
        value: stripe
      - key: DEFAULT_CARRIER
        value: dhl
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@buzzard.de
      - key: ADMIN_PASSWORD
        generateValue: true
