# Buzzard API — Render Blueprint (https://render.com/docs/blueprint-spec)
#
# PERSISTENT SQLite (Part 12 — required for production data):
#   1. Upgrade buzzard-api to a paid plan with persistent disk
#   2. Mount disk at /var/data
#   3. Set BUZZARD_DB_PATH=/var/data/buzzard.db
#   4. Set BUZZARD_BACKUP_DIR=/var/data/backups (optional)
#   5. After deploy: npm run backup:db && node scripts/sync-search-index.mjs
#
# Ephemeral free-tier filesystem LOSES all SQLite data on redeploy.
services:
  - type: web
    name: buzzard-api
    runtime: node
    plan: free
    region: frankfurt
    repo: https://github.com/Buzzard-de/Buzzard
    branch: main
    autoDeployTrigger: commit
    rootDir: .
    buildCommand: node scripts/write-build-info.mjs && cd server && npm ci
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BUZZARD_AI_CHAT_ENABLED
        value: "1"
      - key: BUZZARD_DB_ENABLED
        value: "1"
      - key: BUZZARD_COMMERCIAL_INTEGRATIONS
        value: "1"
      - key: BUZZARD_ORDER_AUTOMATION
        value: "1"
      - key: BUZZARD_SUPPLIER_HUB
        value: "1"
      - key: BUZZARD_CATALOG_SEO
        value: "1"
      - key: BUZZARD_LOCALIZATION_FEEDS
        value: "1"
      - key: BUZZARD_CUSTOMER_CHECKOUT
        value: "1"
      - key: BUZZARD_CUSTOMER_SUPPORT
        value: "1"
      - key: BUZZARD_CRM_LOYALTY
        value: "1"
      - key: BUZZARD_ANALYTICS_DASHBOARD
        value: "1"
      - key: BUZZARD_MARKETING_CENTER
        value: "1"
      - key: BUZZARD_MARKETPLACE_HUB
        value: "1"
      - key: BUZZARD_LOGISTICS_FULFILLMENT
        value: "1"
      - key: BUZZARD_WMS_INVENTORY
        value: "1"
      - key: BUZZARD_PIM_CATALOG
        value: "1"
      - key: BUZZARD_IDENTITY_SECURITY
        value: "1"
      - key: BUZZARD_PAYMENTS_FINANCE
        value: "1"
      - key: BUZZARD_ORDER_MANAGEMENT
        value: "1"
      - key: BUZZARD_CART_CHECKOUT
        value: "1"
      - key: BUZZARD_CRM_CUSTOMER_SERVICE
        value: "1"
      - key: BUZZARD_RETURNS_RMA
        value: "1"
      - key: BUZZARD_MARKETING_LOYALTY
        value: "1"
      - key: BUZZARD_REVIEWS_RATINGS
        value: "1"
      - key: BUZZARD_AI_CENTER
        value: "1"
      - key: BUZZARD_ADVANCED_SEARCH
        value: "1"
      - key: BUZZARD_PRODUCT_CATALOG_PIM
        value: "1"
      - key: BUZZARD_SUPPLIER_INTEGRATION_HUB
        value: "1"
      - key: BUZZARD_ORDER_MANAGEMENT_V32
        value: "1"
      - key: BUZZARD_FULFILLMENT_V33
        value: "1"
      - key: BUZZARD_LOGISTICS_V34
        value: "1"
      - key: BUZZARD_MARKETPLACE_V35
        value: "1"
      - key: BUZZARD_PAYMENTS_V36
        value: "1"
      - key: BUZZARD_INTERNATIONAL_V37
        value: "1"
      - key: BUZZARD_SECURITY_V38
        value: "1"
      - key: BUZZARD_ANALYTICS_V39
        value: "1"
      - key: BUZZARD_MASTER_ADMIN_V40
        value: "1"
      - key: PUBLIC_BASE_URL
        value: "https://buzzard24.de"
      - key: CONTACT_EMAIL
        value: "info@buzzard24.de"
      - key: DEFAULT_SUPPLIER_MODE
        value: "manual"
      - key: BUZZARD_ABANDONED_CART_DELAY_HOURS
        value: "24"
      - key: BUZZARD_SALES_ENABLED
        value: "0"
      - key: BUZZARD_EMBEDDED_INTELLIGENCE
        value: "1"
      - key: BUZZARD_INTELLIGENCE_BRIDGE
        value: "1"
      - key: BUZZARD_INTELLIGENCE_API_URL
        fromService:
          type: web
          name: buzzard-intelligence
          property: host
      - key: BUZZARD_ORCHESTRATOR_URL
        fromService:
          type: web
          name: buzzard-orchestrator
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: BUZZARD_GUARDIAN_URL
        fromService:
          type: web
          name: buzzard-guardian
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: BUZZARD_P1_CATALOG
        value: "1"
      - key: DEFAULT_PAYMENT_PROVIDER
        value: stripe
      - key: DEFAULT_CARRIER
        value: dhl
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@buzzard24.de
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false

  - type: web
    name: buzzard-intelligence
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/Buzzard-de/Buzzard
    branch: main
    autoDeployTrigger: commit
    rootDir: intelligence
    dockerfilePath: buzzard_ai_complete/deploy/docker/Dockerfile
    dockerContext: intelligence
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: PORT
        value: 8000

  - type: web
    name: buzzard-orchestrator
    runtime: python
    plan: free
    region: frankfurt
    repo: https://github.com/Buzzard-de/Buzzard
    branch: main
    autoDeployTrigger: commit
    rootDir: intelligence
    buildCommand: pip install fastapi uvicorn pydantic
    startCommand: uvicorn buzzard_orchestrator:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BUZZARD_DB
        value: /tmp/buzzard_orchestrator.db
      - key: BUZZARD_MAX_RETRIES
        value: "3"
      - key: BUZZARD_TASK_TIMEOUT
        value: "120"
      - key: BUZZARD_APPROVAL_THRESHOLD_EUR
        value: "500"

  - type: web
    name: buzzard-guardian
    runtime: python
    plan: free
    region: frankfurt
    repo: https://github.com/Buzzard-de/Buzzard
    branch: main
    autoDeployTrigger: commit
    rootDir: intelligence
    buildCommand: pip install fastapi uvicorn pydantic
    startCommand: uvicorn buzzard_guardian_api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BUZZARD_GUARDIAN_DB
        value: /tmp/buzzard_guardian.sqlite3
      - key: BUZZARD_BACKUP_DIR
        value: /tmp/guardian_backups
      - key: BUZZARD_SALES_ENABLED
        value: "0"
