services:
  - type: web
    name: buzzard-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: cd server && npm ci
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BUZZARD_AI_CHAT_ENABLED
        value: "1"
      - key: BUZZARD_DB_ENABLED
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@buzzard.de
      - key: ADMIN_PASSWORD
        generateValue: true
